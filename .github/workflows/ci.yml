name: Threat Intelligence KG CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -c "from app.main import app; assert any(r.path == '/ml/link-candidates' for r in app.routes)"
      - run: python -c "from app.graph_ml import graph_ml_report; from app.load_data import load_graph; r=graph_ml_report(load_graph(), 5); assert len(r['candidate_links']) == 5"
      - run: python -m compileall app
