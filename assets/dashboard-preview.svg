<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Threat Intelligence Knowledge Graph dashboard preview</title><desc id="desc">Static synthetic dashboard preview for CTI evidence paths and analyst-gated graph link prediction.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09101d"/><stop offset="1" stop-color="#1b1731"/></linearGradient></defs><rect width="1200" height="640" rx="24" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" font-size="29" font-weight="800" fill="#f8fafc">Threat Intelligence Knowledge Graph</text><text x="48" y="87" font-size="13" font-weight="700" letter-spacing="1.4" fill="#c4b5fd">EVIDENCE PATHS · GRAPH RETRIEVAL · LINK PREDICTION</text><text x="1148" y="63" text-anchor="end" font-size="12" font-weight="700" fill="#94a3b8">STATIC / SYNTHETIC PREVIEW</text><rect x="48" y="118" width="255" height="92" rx="15" fill="#141829" stroke="#3d3657"/><text x="68" y="147" font-size="11" font-weight="700" fill="#94a3b8">KNOWN EDGES</text><text x="68" y="184" font-size="24" font-weight="800" fill="#4ade80">EVIDENCE</text><rect x="323" y="118" width="255" height="92" rx="15" fill="#141829" stroke="#3d3657"/><text x="343" y="147" font-size="11" font-weight="700" fill="#94a3b8">GRAPH MODEL</text><text x="343" y="184" font-size="24" font-weight="800" fill="#c4b5fd">LOGISTIC LINK ML</text><rect x="598" y="118" width="255" height="92" rx="15" fill="#141829" stroke="#3d3657"/><text x="618" y="147" font-size="11" font-weight="700" fill="#94a3b8">PREDICTED EDGES</text><text x="618" y="184" font-size="24" font-weight="800" fill="#93c5fd">CANDIDATES</text><rect x="873" y="118" width="279" height="92" rx="15" fill="#141829" stroke="#3d3657"/><text x="893" y="147" font-size="11" font-weight="700" fill="#94a3b8">ACCEPTANCE</text><text x="893" y="184" font-size="24" font-weight="800" fill="#fbbf24">ANALYST-GATED</text><rect x="48" y="236" width="535" height="306" rx="18" fill="#111626" stroke="#3d3657"/><text x="72" y="272" font-size="18" font-weight="800" fill="#f8fafc">Evidence graph</text><text x="72" y="298" font-size="12" fill="#94a3b8">Explicit CTI relationships remain the source of truth</text><circle cx="115" cy="382" r="30" fill="#1d4ed8"/><text x="115" y="387" text-anchor="middle" font-size="11" font-weight="800" fill="#dbeafe">Actor</text><circle cx="270" cy="342" r="34" fill="#6d28d9"/><text x="270" y="347" text-anchor="middle" font-size="11" font-weight="800" fill="#ede9fe">Campaign</text><circle cx="425" cy="382" r="32" fill="#0f766e"/><text x="425" y="387" text-anchor="middle" font-size="11" font-weight="800" fill="#ccfbf1">Indicator</text><circle cx="270" cy="472" r="34" fill="#9a3412"/><text x="270" y="477" text-anchor="middle" font-size="11" font-weight="800" fill="#ffedd5">Technique</text><path d="M143 373 L237 351 M303 351 L395 373 M270 377 L270 438" stroke="#64748b" stroke-width="3"/><text x="72" y="523" font-size="12" fill="#94a3b8">Typed edges · bounded traversal · transparent path confidence</text><rect x="607" y="236" width="545" height="306" rx="18" fill="#111626" stroke="#3d3657"/><text x="631" y="272" font-size="18" font-weight="800" fill="#f8fafc">Missing-link review queue</text><text x="631" y="298" font-size="12" fill="#94a3b8">Structural ML proposes questions, not attribution</text><rect x="631" y="329" width="472" height="58" rx="12" fill="#1c1832" stroke="#6d28d9"/><text x="651" y="353" font-size="12" font-weight="700" fill="#c4b5fd">CANDIDATE A</text><text x="651" y="375" font-size="13" font-weight="650" fill="#e2e8f0">shared neighbors · two-hop path · type prior</text><rect x="631" y="402" width="472" height="58" rx="12" fill="#172438" stroke="#2563eb"/><text x="651" y="426" font-size="12" font-weight="700" fill="#93c5fd">CANDIDATE B</text><text x="651" y="448" font-size="13" font-weight="650" fill="#e2e8f0">ranked for collection / evidence validation</text><rect x="631" y="475" width="472" height="42" rx="12" fill="#302410" stroke="#a16207"/><text x="651" y="501" font-size="13" font-weight="800" fill="#fbbf24">NO AUTOMATIC EDGE WRITES</text><text x="48" y="592" font-size="12" fill="#94a3b8">Preview represents synthetic CTI mechanics only; candidate scores are ranking signals and do not establish attribution.</text></g></svg>